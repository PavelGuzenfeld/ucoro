name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    name: ${{ matrix.os }} - ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            compiler: gcc-13
            install_cmd: |
              sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
              sudo apt-get update
              sudo apt-get install -y gcc-13 g++-13 cmake ninja-build
            cc: gcc-13
            cxx: g++-13
            cxxflags: ""
            ldflags: ""

          - os: ubuntu-22.04
            compiler: clang-18
            install_cmd: |
              wget https://apt.llvm.org/llvm.sh
              chmod +x llvm.sh
              sudo ./llvm.sh 18
              sudo apt-get install -y cmake ninja-build libc++-18-dev libc++abi-18-dev
            cc: clang-18
            cxx: clang++-18
            cxxflags: "-stdlib=libc++"
            ldflags: "-stdlib=libc++ -lc++abi"

          - os: macos-14
            compiler: apple-clang
            install_cmd: brew install cmake ninja
            cc: clang
            cxx: clang++
            cxxflags: ""
            ldflags: ""

          - os: windows-latest
            compiler: msvc
            install_cmd: echo "MSVC is pre-installed"
            cxxflags: ""
            ldflags: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        if: runner.os != 'Windows'
        run: ${{ matrix.install_cmd }}
        shell: bash

      - name: Configure CMake (Unix)
        if: runner.os != 'Windows'
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="${{ matrix.cxxflags }}" \
            -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.ldflags }}" \
            -DUCORO_BUILD_TESTS=ON \
            -DUCORO_BUILD_EXAMPLES=ON \
            -DUCORO_BUILD_BENCHMARKS=ON

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DUCORO_BUILD_TESTS=ON -DUCORO_BUILD_EXAMPLES=ON -DUCORO_BUILD_BENCHMARKS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Run Tests
        working-directory: build
        run: ctest --output-on-failure -C Release

      - name: Run Benchmarks (Unix)
        if: runner.os != 'Windows'
        working-directory: build
        run: ./benchmark_ucoro || true

      - name: Run Benchmarks (Windows)
        if: runner.os == 'Windows'
        working-directory: build
        run: .\Release\benchmark_ucoro.exe || true
