site_name: ucoro
site_description: Header-only C++23 stackful coroutines over minicoro.
site_url: https://pavelguzenfeld.com/ucoro/
repo_url: https://github.com/PavelGuzenfeld/ucoro
repo_name: PavelGuzenfeld/ucoro
edit_uri: edit/main/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - toc.follow

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guide: guide.md
  - Advanced examples: examples.md
  - API reference: api.md
  - Safety: safety.md
  - Benchmarks: benchmarks.md
  - Design: design.md
  - Roadmap: roadmap.md
